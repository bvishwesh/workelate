services:
  - type: web
    name: workelate-agent
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./workelate.db
      - key: CLI_EXECUTION_TIMEOUT_SECONDS
        value: 60
      - key: MAX_CRAWL_DEPTH
        value: 3
      - key: MAX_CRAWL_PAGES
        value: 15
